<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Instituto Evolução</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="imagens/icone.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="0_style.css">
</head>
<body>
    <!-- Header -->
    <header class="bg-white shadow-sm sticky-top">
        <nav class="container-fluid">
            <div class="row align-items-center py-2">
                <div class="col-6 col-md-3">
                    <img src="imagens/logo.png" alt="Logo" class="logo-img" id="logo">
                </div>
                <div class="col-6 col-md-9 d-flex justify-content-end align-items-center gap-3">
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary d-md-none" type="button" id="menuButton" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-bars"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" id="navMenu" aria-labelledby="menuButton">
                            <!-- Menu dinâmico -->
                        </ul>
                    </div>
                    <div id="authButtons">
                        <button class="btn btn-primary" id="loginBtn">Login</button>
                    </div>
                </div>
            </div>
            <!-- Menu desktop -->
            <div class="row d-none d-md-block">
                <div class="col-12">
                    <ul class="nav nav-tabs" id="desktopMenu">
                        <!-- Menu desktop dinâmico -->
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container-fluid mt-3">
        <div id="contentArea">
            <!-- O conteúdo de cada tela será carregado aqui -->
        </div>
    </main>

    <!-- Modal de Login -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuário (Login)</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div id="loginError" class="alert alert-danger d-none"></div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="0_firebase_api_config.js"></script>
    <script type="module" src="scripts_telas/0_funcoes_compartilhadas.js"></script>
    <script type="module">
        import { auth, db, signInWithEmailAndPassword, doc, getDoc } from './0_firebase_api_config.js';
        import { carregarTela, verificarSessao, logout } from './scripts_telas/0_funcoes_compartilhadas.js';

        let currentUser = null;
        let loginModalInstance = null;

        window.verificarAcesso = async function() {
            currentUser = await verificarSessao();
            if (currentUser) {
                document.getElementById('authButtons').innerHTML = `
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                            ${currentUser.nome || currentUser.login}
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" id="logoutBtn">Sair</a></li>
                        </ul>
                    </div>
                `;
                document.getElementById('logoutBtn').addEventListener('click', () => {
                    logout();
                    location.reload();
                });
                carregarMenu(currentUser.cargo);
                await carregarTela('home', currentUser);
            } else {
                document.getElementById('authButtons').innerHTML = '<button class="btn btn-primary" id="loginBtn">Login</button>';
                document.getElementById('loginBtn').addEventListener('click', abrirModalLogin);
                document.getElementById('navMenu').innerHTML = '';
                document.getElementById('desktopMenu').innerHTML = '';
            }
        };

        function carregarMenu(cargo) {
            let menuItems = [];
            if (cargo === 'Cliente' || cargo === 'cliente') {
                menuItems = [
                    { id: 'home', nome: 'Home', icon: 'fa-home' },
                    { id: 'clientes_agendamentos', nome: 'Meus Agendamentos', icon: 'fa-calendar' },
                    { id: 'clientes_palestras', nome: 'Palestras Online', icon: 'fa-video' },
                    { id: 'clientes_cursos', nome: 'Cursos', icon: 'fa-graduation-cap' }
                ];
            } else {
                menuItems = [
                    { id: 'home', nome: 'Home', icon: 'fa-home' },
                    { id: 'funcionarios_agendamentos', nome: 'Agendamentos', icon: 'fa-calendar-check' },
                    { id: 'funcionarios_palestras', nome: 'Gestão de Palestras', icon: 'fa-chalkboard-user' },
                    { id: 'funcionarios_cursos', nome: 'Gestão de Cursos', icon: 'fa-book-open' },
                    { id: 'funcionarios_cadastros', nome: 'Gestão de Cadastros', icon: 'fa-users-gear' }
                ];
            }

            // Menu mobile
            const navMenu = document.getElementById('navMenu');
            navMenu.innerHTML = menuItems.map(item => `
                <li><a class="dropdown-item" href="#" data-tela="${item.id}">
                    <i class="fas ${item.icon} me-2"></i>${item.nome}
                </a></li>
            `).join('');

            // Menu desktop
            const desktopMenu = document.getElementById('desktopMenu');
            desktopMenu.innerHTML = menuItems.map(item => `
                <li class="nav-item">
                    <a class="nav-link" href="#" data-tela="${item.id}">
                        <i class="fas ${item.icon} me-2"></i>${item.nome}
                    </a>
                </li>
            `).join('');

            document.querySelectorAll('[data-tela]').forEach(link => {
                link.addEventListener('click', async (e) => {
                    e.preventDefault();
                    const telaId = link.getAttribute('data-tela');
                    await carregarTela(telaId, currentUser);
                    // Atualizar classe ativa
                    document.querySelectorAll('.nav-link').forEach(nav => nav.classList.remove('active'));
                    link.classList.add('active');
                });
            });
        }

        function abrirModalLogin() {
            loginModalInstance = new bootstrap.Modal(document.getElementById('loginModal'));
            loginModalInstance.show();
        }

        document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            try {
                // Buscar usuário no Firestore
                const userDoc = await getDoc(doc(db, 'logins', username));
                
                if (!userDoc.exists()) {
                    throw new Error('Usuário não encontrado');
                }

                const userData = userDoc.data();
                
                if (userData.senha !== password) {
                    throw new Error('Senha incorreta');
                }

                if (!userData.status_ativo) {
                    throw new Error('Usuário inativo');
                }

                // Salvar sessão
                const sessionData = {
                    login: username,
                    nome: userData.nome,
                    cargo: userData.cargo,
                    perfil: userData.perfil,
                    email: userData.email
                };
                localStorage.setItem('userSession', JSON.stringify(sessionData));
                
                loginModalInstance.hide();
                await window.verificarAcesso();
                
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('d-none');
            }
        });

        // Inicializar
        window.verificarAcesso();
    </script>
</body>
</html>
