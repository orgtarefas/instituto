<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Instituto Evolução</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="imagens/icone.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="0_style.css">
</head>
<body>
    <!-- Header -->
    <header class="bg-white shadow-sm sticky-top">
        <nav class="container-fluid">
            <div class="row align-items-center py-2">
                <div class="col-6">
                    <img src="imagens/logo.png" alt="Logo" class="logo-img" id="logo">
                </div>
                <div class="col-6 d-flex justify-content-end align-items-center">
                    <div class="dropdown">
                        <button class="btn btn-link text-dark p-0" type="button" id="menuButton" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-ellipsis-v fa-2x"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" id="navMenu">
                            <li><a class="dropdown-item disabled" href="#">Faça login primeiro</a></li>
                        </ul>
                    </div>
                    
                    <div id="authButtons" class="ms-3">
                        <button class="btn btn-primary" id="loginBtn">Login</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-content" id="mainContent">
        <div class="content-wrapper" id="contentArea">
            <div class="text-center py-5">
                <i class="fas fa-shield-alt fa-4x text-primary mb-4"></i>
                <h3>Sistema Seguro</h3>
                <p class="text-muted">Faça login para acessar o sistema</p>
            </div>
        </div>
    </main>

    <!-- Modal de Login -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Login Seguro</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuário</label>
                            <input type="text" class="form-control" id="username" required placeholder="Digite seu login">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="password" required placeholder="Digite sua senha">
                        </div>
                        <div id="loginError" class="alert alert-danger d-none"></div>
                        <div id="loginLoading" class="text-center d-none">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Autenticando...</span>
                            </div>
                            <p class="mt-2">Verificando credenciais...</p>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="0_firebase_api_config.js"></script>
    <script type="module">
        import { 
            db, 
            auth, 
            signInWithEmailAndPassword, 
            signOut,
            onAuthStateChanged,
            doc, 
            getDoc,
            query,
            collection,
            where,
            getDocs
        } from './0_firebase_api_config.js';
        import { 
            carregarTela, 
            carregarMenu,
            mostrarNotificacao,
            aplicarBackground,
            getCurrentUser
        } from './scripts_telas/0_funcoes_compartilhadas.js';

        let loginModalInstance = null;
        let currentUserData = null;

        // Monitorar estado de autenticação (FONTE ÚNICA DA VERDADE)
        onAuthStateChanged(auth, async (firebaseUser) => {
            if (firebaseUser) {
                // Usuário autenticado no Firebase - buscar dados atualizados
                console.log('✅ Usuário autenticado:', firebaseUser.email);
                
                try {
                    // Buscar dados do Firestore usando o email
                    const loginsRef = collection(db, 'logins');
                    const q = query(loginsRef, where('email', '==', firebaseUser.email));
                    const querySnapshot = await getDocs(q);
                    
                    if (!querySnapshot.empty) {
                        querySnapshot.forEach((doc) => {
                            currentUserData = {
                                uid: firebaseUser.uid,
                                login: doc.id,
                                nome: doc.data().nome,
                                cargo: doc.data().cargo,
                                perfil: doc.data().perfil,
                                email: doc.data().email,
                                status_ativo: doc.data().status_ativo
                            };
                        });
                        
                        // Verificar se está ativo
                        if (!currentUserData.status_ativo) {
                            await signOut(auth);
                            mostrarNotificacao('Usuário inativo. Contate o administrador.', 'error');
                            return;
                        }
                        
                        // Atualizar interface
                        document.getElementById('authButtons').innerHTML = `
                            <div class="dropdown">
                                <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                    <i class="fas fa-user-shield me-1"></i>${currentUserData.nome.split(' ')[0]}
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" href="#" id="logoutBtn">
                                        <i class="fas fa-sign-out-alt me-2"></i>Sair
                                    </a></li>
                                </ul>
                            </div>
                        `;
                        
                        document.getElementById('logoutBtn').addEventListener('click', async () => {
                            await signOut(auth);
                            currentUserData = null;
                            mostrarNotificacao('Logout realizado com sucesso!', 'info');
                        });
                        
                        // Carregar menu e tela inicial
                        carregarMenu(currentUserData.cargo, currentUserData);
                        await carregarTela('home', currentUserData);
                        
                    } else {
                        // Usuário autenticado mas sem dados no Firestore
                        console.error('Usuário sem permissões');
                        await signOut(auth);
                        mostrarNotificacao('Usuário não autorizado no sistema.', 'error');
                    }
                    
                } catch (error) {
                    console.error('Erro ao buscar dados:', error);
                    await signOut(auth);
                    mostrarNotificacao('Erro ao carregar dados do usuário.', 'error');
                }
                
            } else {
                // Usuário não autenticado
                currentUserData = null;
                
                // Limpar qualquer dado sensível
                sessionStorage.clear();
                
                // Mostrar tela de login
                document.getElementById('authButtons').innerHTML = '<button class="btn btn-primary" id="loginBtn"><i class="fas fa-sign-in-alt me-2"></i>Login</button>';
                const loginBtn = document.getElementById('loginBtn');
                if (loginBtn) {
                    loginBtn.removeEventListener('click', abrirModalLogin);
                    loginBtn.addEventListener('click', abrirModalLogin);
                }
                
                // Limpar menu
                const navMenu = document.getElementById('navMenu');
                if (navMenu) {
                    navMenu.innerHTML = '<li><a class="dropdown-item disabled" href="#"><i class="fas fa-lock me-2"></i>Faça login</a></li>';
                }
                
                // Tela de boas-vindas
                const contentArea = document.getElementById('contentArea');
                if (contentArea) {
                    contentArea.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-shield-alt fa-4x text-primary mb-4"></i>
                            <h3 class="mb-3">Sistema Seguro</h3>
                            <p class="text-muted mb-4">Autenticação via Firebase</p>
                            <button class="btn btn-primary btn-lg" id="telaLoginBtn">
                                <i class="fas fa-sign-in-alt me-2"></i>Fazer Login
                            </button>
                        </div>
                    `;
                    
                    document.getElementById('telaLoginBtn')?.addEventListener('click', abrirModalLogin);
                }
                
                aplicarBackground('home', 'cliente');
            }
        });
        
        function abrirModalLogin() {
            const modalElement = document.getElementById('loginModal');
            loginModalInstance = new bootstrap.Modal(modalElement);
            document.getElementById('loginForm').reset();
            document.getElementById('loginError').classList.add('d-none');
            loginModalInstance.show();
        }

        // Processar login
        document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const loginLoading = document.getElementById('loginLoading');
            const submitBtn = document.querySelector('#loginForm button[type="submit"]');

            errorDiv.classList.add('d-none');
            loginLoading.classList.remove('d-none');
            submitBtn.disabled = true;

            try {
                // 1. Buscar email no Firestore
                const userDoc = await getDoc(doc(db, 'logins', username));
                
                if (!userDoc.exists()) {
                    throw new Error('Usuário não encontrado');
                }

                const userData = userDoc.data();
                
                // 2. Verificar status
                if (!userData.status_ativo) {
                    throw new Error('Usuário inativo');
                }
                
                // 3. Verificar email
                if (!userData.email) {
                    throw new Error('Email não configurado');
                }
                
                // 4. Autenticar no Firebase Auth (ÚNICA VALIDAÇÃO DE SENHA)
                await signInWithEmailAndPassword(auth, userData.email, password);
                
                // 5. Fechar modal
                loginModalInstance.hide();
                mostrarNotificacao(`Bem-vindo(a) ${userData.nome}!`, 'success');
                
            } catch (error) {
                console.error('Erro no login:', error);
                
                let mensagem = error.message;
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
                    mensagem = 'Usuário ou senha incorretos';
                } else if (error.code === 'auth/too-many-requests') {
                    mensagem = 'Muitas tentativas. Tente mais tarde';
                }
                
                errorDiv.textContent = mensagem;
                errorDiv.classList.remove('d-none');
                loginLoading.classList.add('d-none');
                submitBtn.disabled = false;
            }
        });
        
        // Proteção contra XSS - Sanitização
        function sanitizarHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        // Configurar CSP (Content Security Policy) no meta tag
        const meta = document.createElement('meta');
        meta.httpEquiv = 'Content-Security-Policy';
        meta.content = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.gstatic.com 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline';";
        document.head.appendChild(meta);
    </script>
</body>
</html>
