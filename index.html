<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Instituto Evolução</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="imagens/icone.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="0_style.css">
</head>
<body>
    <!-- Header -->
    <header class="bg-white shadow-sm sticky-top">
        <nav class="container-fluid">
            <div class="row align-items-center py-2">
                <div class="col-6">
                    <img src="imagens/logo.png" alt="Logo" class="logo-img" id="logo">
                </div>
                <div class="col-6 d-flex justify-content-end align-items-center">
                    <!-- Menu de 3 pontinhos -->
                    <div class="dropdown">
                        <button class="btn btn-link text-dark p-0" type="button" id="menuButton" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-ellipsis-v fa-2x"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" id="navMenu">
                            <li><a class="dropdown-item" href="#">Faça login primeiro</a></li>
                        </ul>
                    </div>
                    
                    <!-- Área de autenticação -->
                    <div id="authButtons" class="ms-3">
                        <button class="btn btn-primary" id="loginBtn">Login</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-content" id="mainContent">
        <div class="content-wrapper" id="contentArea">
            <div class="text-center py-5">
                <i class="fas fa-spinner fa-pulse fa-3x text-primary mb-3"></i>
                <h3>Carregando sistema...</h3>
            </div>
        </div>
    </main>

    <!-- Modal de Login -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Acesso ao Sistema</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuário</label>
                            <input type="text" class="form-control" id="username" required autocomplete="username">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="password" required autocomplete="current-password">
                        </div>
                        <div id="loginError" class="alert alert-danger d-none"></div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="0_firebase_api_config.js"></script>
    <script type="module" src="scripts_telas/0_funcoes_compartilhadas.js"></script>
    <script type="module">
        import { db, doc, getDoc } from './0_firebase_api_config.js';
        import { 
            carregarTela, 
            verificarSessao, 
            logout, 
            carregarMenu,
            mostrarNotificacao,
            aplicarBackground
        } from './scripts_telas/0_funcoes_compartilhadas.js';

        let currentUser = null;
        let loginModalInstance = null;

        // Função principal de verificação de acesso
        window.verificarAcesso = async function() {
            currentUser = await verificarSessao();
            
            if (currentUser) {
                // Usuário logado
                document.getElementById('authButtons').innerHTML = `
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user me-1"></i>${currentUser.nome.split(' ')[0]}
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="logoutBtn">
                                <i class="fas fa-sign-out-alt me-2"></i>Sair
                            </a></li>
                        </ul>
                    </div>
                `;
                
                document.getElementById('logoutBtn').addEventListener('click', async () => {
                    await logout();
                    window.verificarAcesso();
                    mostrarNotificacao('Logout realizado com sucesso!', 'info');
                });
                
                // Carregar menu e tela inicial
                carregarMenu(currentUser.cargo);
                await carregarTela('home', currentUser);
            } else {
                // Usuário não logado
                document.getElementById('authButtons').innerHTML = '<button class="btn btn-primary" id="loginBtn"><i class="fas fa-sign-in-alt me-2"></i>Login</button>';
                document.getElementById('loginBtn').addEventListener('click', abrirModalLogin);
                
                // Limpar menu e mostrar conteúdo padrão
                const navMenu = document.getElementById('navMenu');
                if (navMenu) {
                    navMenu.innerHTML = '<li><a class="dropdown-item disabled" href="#">Faça login para acessar o menu</a></li>';
                }
                
                const contentArea = document.getElementById('contentArea');
                if (contentArea) {
                    contentArea.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-lock fa-3x text-secondary mb-3"></i>
                            <h3>Sistema Protegido</h3>
                            <p>Por favor, faça login para acessar todas as funcionalidades</p>
                            <button class="btn btn-primary" onclick="document.getElementById('loginBtn').click()">
                                <i class="fas fa-sign-in-alt me-2"></i>Realizar Login
                            </button>
                        </div>
                    `;
                }
                
                aplicarBackground('home', 'cliente');
            }
        };

        // Abrir modal de login
        function abrirModalLogin() {
            loginModalInstance = new bootstrap.Modal(document.getElementById('loginModal'));
            loginModalInstance.show();
        }

        // Processar login
        document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            try {
                // Buscar usuário no Firestore
                const userDoc = await getDoc(doc(db, 'logins', username));
                
                if (!userDoc.exists()) {
                    throw new Error('Usuário não encontrado');
                }

                const userData = userDoc.data();
                
                // Verificar senha
                if (userData.senha !== password) {
                    throw new Error('Senha incorreta');
                }

                // Verificar status
                if (!userData.status_ativo) {
                    throw new Error('Usuário inativo. Contate o administrador.');
                }

                // Salvar sessão
                const sessionData = {
                    login: username,
                    nome: userData.nome,
                    cargo: userData.cargo,
                    perfil: userData.perfil,
                    email: userData.email
                };
                
                localStorage.setItem('userSession', JSON.stringify(sessionData));
                
                loginModalInstance.hide();
                document.getElementById('loginForm').reset();
                mostrarNotificacao(`Bem-vindo(a) ${userData.nome}!`, 'success');
                
                // Recarregar a interface
                await window.verificarAcesso();
                
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('d-none');
                
                setTimeout(() => {
                    errorDiv.classList.add('d-none');
                }, 3000);
            }
        });

        // Inicializar sistema
        window.verificarAcesso();
    </script>
</body>
</html>
