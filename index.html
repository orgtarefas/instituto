<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Instituto Evolução</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="imagens/icone.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="0_style.css">
</head>
<body>
    <!-- Header -->
    <header class="bg-white shadow-sm sticky-top">
        <nav class="container-fluid">
            <div class="row align-items-center py-2">
                <div class="col-6">
                    <img src="imagens/logo.png" alt="Logo" class="logo-img" id="logo">
                </div>
                <div class="col-6 d-flex justify-content-end align-items-center">
                    <!-- Menu de 3 pontinhos -->
                    <div class="dropdown">
                        <button class="btn btn-link text-dark p-0" type="button" id="menuButton" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-ellipsis-v fa-2x"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" id="navMenu">
                            <li><a class="dropdown-item" href="#">Faça login primeiro</a></li>
                        </ul>
                    </div>
                    
                    <!-- Área de autenticação -->
                    <div id="authButtons" class="ms-3">
                        <button class="btn btn-primary" id="loginBtn">Login</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-content" id="mainContent">
        <div class="content-wrapper" id="contentArea">
            <div class="text-center py-5">
                <i class="fas fa-spinner fa-pulse fa-3x text-primary mb-3"></i>
                <h3>Carregando sistema...</h3>
            </div>
        </div>
    </main>

    <!-- Modal de Login -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Acesso ao Sistema</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuário (Login)</label>
                            <input type="text" class="form-control" id="username" required autocomplete="username" placeholder="Digite seu login">
                            <small class="text-muted">Ex: thiago.barbosa</small>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="password" required autocomplete="current-password" placeholder="Digite sua senha">
                        </div>
                        <div id="loginError" class="alert alert-danger d-none"></div>
                        <div id="loginLoading" class="text-center d-none">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Autenticando...</span>
                            </div>
                            <p class="mt-2">Verificando credenciais...</p>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="submitLoginBtn">
                            <i class="fas fa-sign-in-alt me-2"></i>Entrar
                        </button>
                    </form>
                    <hr class="my-3">
                    <div class="text-center">
                        <small class="text-muted">Sistema seguro com autenticação Firebase</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de sessão expirada -->
    <div class="modal fade" id="sessionExpiredModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title">Sessão Expirada</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Sua sessão expirou. Por favor, faça login novamente para continuar.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="reloadLoginBtn">Fazer Login</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="0_firebase_api_config.js"></script>
    <script type="module" src="scripts_telas/0_funcoes_compartilhadas.js"></script>
    <script type="module">
        import { 
            db, 
            auth, 
            signInWithEmailAndPassword, 
            signOut,
            onAuthStateChanged,
            doc, 
            getDoc 
        } from './0_firebase_api_config.js';
        import { 
            carregarTela, 
            verificarSessao, 
            logout, 
            carregarMenu,
            mostrarNotificacao,
            aplicarBackground
        } from './scripts_telas/0_funcoes_compartilhadas.js';

        let currentUser = null;
        let loginModalInstance = null;
        let sessionExpiredModalInstance = null;

        // Monitorar estado de autenticação do Firebase
        onAuthStateChanged(auth, async (firebaseUser) => {
            if (firebaseUser) {
                // Usuário autenticado no Firebase
                console.log('Usuário autenticado no Firebase:', firebaseUser.email);
                
                // Verificar se tem sessão local
                const localSession = await verificarSessao();
                if (!localSession) {
                    // Se não tem sessão local, mas tem Firebase, fazer logout
                    await signOut(auth);
                    mostrarNotificacao('Sessão inválida. Faça login novamente.', 'warning');
                }
            } else {
                // Usuário não autenticado no Firebase
                const localSession = await verificarSessao();
                if (localSession) {
                    // Limpar sessão local
                    localStorage.removeItem('userSession');
                    mostrarNotificacao('Sessão expirada. Faça login novamente.', 'warning');
                    await window.verificarAcesso();
                }
            }
        });

        // Função principal de verificação de acesso
        window.verificarAcesso = async function() {
            currentUser = await verificarSessao();
            
            if (currentUser) {
                // Verificar se o Firebase Auth ainda está autenticado
                if (!auth.currentUser) {
                    // Se não está autenticado no Firebase, limpar sessão
                    localStorage.removeItem('userSession');
                    currentUser = null;
                    await window.verificarAcesso();
                    return;
                }
                
                // Usuário logado
                document.getElementById('authButtons').innerHTML = `
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>${currentUser.nome.split(' ')[0]}
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="logoutBtn">
                                <i class="fas fa-sign-out-alt me-2"></i>Sair
                            </a></li>
                        </ul>
                    </div>
                `;
                
                document.getElementById('logoutBtn').addEventListener('click', async () => {
                    await logout();
                    await signOut(auth);
                    window.verificarAcesso();
                    mostrarNotificacao('Logout realizado com sucesso!', 'info');
                });
                
                // Carregar menu e tela inicial
                carregarMenu(currentUser.cargo);
                await carregarTela('home', currentUser);
            } else {
                // Usuário não logado
                document.getElementById('authButtons').innerHTML = '<button class="btn btn-primary" id="loginBtn"><i class="fas fa-sign-in-alt me-2"></i>Login</button>';
                const loginBtn = document.getElementById('loginBtn');
                if (loginBtn) {
                    loginBtn.addEventListener('click', abrirModalLogin);
                }
                
                // Limpar menu e mostrar conteúdo padrão
                const navMenu = document.getElementById('navMenu');
                if (navMenu) {
                    navMenu.innerHTML = '<li><a class="dropdown-item disabled" href="#"><i class="fas fa-lock me-2"></i>Faça login para acessar o menu</a></li>';
                }
                
                const contentArea = document.getElementById('contentArea');
                if (contentArea) {
                    contentArea.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-lock fa-4x text-secondary mb-4"></i>
                            <h3 class="mb-3">Sistema Protegido</h3>
                            <p class="text-muted mb-4">Por favor, faça login para acessar todas as funcionalidades</p>
                            <button class="btn btn-primary btn-lg" onclick="document.getElementById('loginBtn').click()">
                                <i class="fas fa-sign-in-alt me-2"></i>Realizar Login
                            </button>
                        </div>
                    `;
                }
                
                aplicarBackground('home', 'cliente');
            }
        };

        // Abrir modal de login
        function abrirModalLogin() {
            // Limpar formulário
            document.getElementById('loginForm').reset();
            document.getElementById('loginError').classList.add('d-none');
            loginModalInstance = new bootstrap.Modal(document.getElementById('loginModal'));
            loginModalInstance.show();
        }

        // Processar login com Firebase Auth
        document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const loginLoading = document.getElementById('loginLoading');
            const submitBtn = document.getElementById('submitLoginBtn');

            // Reset error
            errorDiv.classList.add('d-none');
            
            // Mostrar loading
            loginLoading.classList.remove('d-none');
            submitBtn.disabled = true;

            try {
                // 1. Buscar usuário no Firestore pelo login (documento)
                const userDoc = await getDoc(doc(db, 'logins', username));
                
                if (!userDoc.exists()) {
                    throw new Error('Usuário não encontrado');
                }

                const userData = userDoc.data();
                
                // 2. Verificar se o usuário está ativo
                if (!userData.status_ativo) {
                    throw new Error('Usuário inativo. Contate o administrador.');
                }
                
                // 3. Verificar se tem email fake vinculado
                if (!userData.email || userData.email === '') {
                    throw new Error('Email não configurado para este usuário. Contate o administrador.');
                }
                
                // 4. Autenticar no Firebase Auth usando o email fake
                try {
                    await signInWithEmailAndPassword(auth, userData.email, password);
                } catch (authError) {
                    console.error('Erro de autenticação:', authError);
                    
                    // Tratar erros específicos do Firebase Auth
                    switch (authError.code) {
                        case 'auth/invalid-credential':
                        case 'auth/wrong-password':
                        case 'auth/user-not-found':
                            throw new Error('Senha incorreta. Verifique suas credenciais.');
                        case 'auth/too-many-requests':
                            throw new Error('Muitas tentativas falhas. Tente novamente mais tarde.');
                        default:
                            throw new Error('Erro na autenticação. Verifique sua senha.');
                    }
                }
                
                // 5. Salvar sessão local
                const sessionData = {
                    login: username,
                    nome: userData.nome,
                    cargo: userData.cargo,
                    perfil: userData.perfil,
                    email: userData.email,
                    uid: auth.currentUser?.uid
                };
                
                localStorage.setItem('userSession', JSON.stringify(sessionData));
                
                // 6. Fechar modal e mostrar sucesso
                loginModalInstance.hide();
                document.getElementById('loginForm').reset();
                mostrarNotificacao(`Bem-vindo(a) ${userData.nome}! Autenticação realizada com sucesso.`, 'success');
                
                // 7. Recarregar a interface
                await window.verificarAcesso();
                
            } catch (error) {
                console.error('Erro no login:', error);
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('d-none');
                
                // Limpar loading após erro
                loginLoading.classList.add('d-none');
                submitBtn.disabled = false;
                
                // Se houve erro de autenticação, garantir que o Firebase Auth está limpo
                if (auth.currentUser) {
                    await signOut(auth);
                }
                
                // Auto-esconder erro após 3 segundos
                setTimeout(() => {
                    errorDiv.classList.add('d-none');
                }, 3000);
            } finally {
                // Restaurar botão se não foi redirecionado
                if (loginLoading && !loginLoading.classList.contains('d-none')) {
                    loginLoading.classList.add('d-none');
                    submitBtn.disabled = false;
                }
            }
        });

        // Verificar sessão ao carregar a página
        window.verificarAcesso();
        
        // Verificar periodicamente a sessão (a cada 5 minutos)
        setInterval(async () => {
            const session = await verificarSessao();
            if (session && !auth.currentUser) {
                // Sessão local existe mas Firebase não está autenticado
                localStorage.removeItem('userSession');
                mostrarNotificacao('Sessão expirada. Faça login novamente.', 'warning');
                window.verificarAcesso();
            }
        }, 300000); // 5 minutos
    </script>
</body>
</html>
