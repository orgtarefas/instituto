<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Instituto Evolução</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="imagens/icone.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="0_style.css">
</head>
<body>
    <!-- Header -->
    <header class="bg-white shadow-sm sticky-top">
        <nav class="container-fluid">
            <div class="row align-items-center py-2">
                <div class="col-6">
                    <img src="imagens/logo.png" alt="Logo" class="logo-img" id="logo">
                </div>
                <div class="col-6 d-flex justify-content-end align-items-center">
                    <!-- Menu de 3 pontinhos -->
                    <div class="dropdown">
                        <button class="btn btn-link text-dark p-0" type="button" id="menuButton" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-ellipsis-v fa-2x"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" id="navMenu">
                            <li><a class="dropdown-item disabled" href="#">Faça login primeiro</a></li>
                        </ul>
                    </div>
                    
                    <!-- Área de autenticação -->
                    <div id="authButtons" class="ms-3">
                        <button class="btn btn-primary" id="loginBtn">Login</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-content" id="mainContent">
        <div class="content-wrapper" id="contentArea">
            <div class="text-center py-5">
                <i class="fas fa-lock fa-4x text-secondary mb-4"></i>
                <h3>Sistema Protegido</h3>
                <p class="text-muted">Faça login para acessar o sistema</p>
            </div>
        </div>
    </main>

    <!-- Modal de Login -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Acesso ao Sistema</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuário (Login)</label>
                            <input type="text" class="form-control" id="username" required placeholder="Ex: thiago.barbosa">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="password" required placeholder="Digite sua senha">
                        </div>
                        <div id="loginError" class="alert alert-danger d-none"></div>
                        <div id="loginLoading" class="text-center d-none">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Autenticando...</span>
                            </div>
                            <p class="mt-2">Verificando credenciais...</p>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="submitLoginBtn">
                            Entrar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="0_firebase_api_config.js"></script>
    <script type="module" src="scripts_telas/0_funcoes_compartilhadas.js"></script>
    <script type="module">
        import { 
            db, 
            auth, 
            signInWithEmailAndPassword, 
            signOut,
            doc, 
            getDoc,
            onAuthStateChanged
        } from './0_firebase_api_config.js';
        import { 
            carregarTela, 
            carregarMenu,
            mostrarNotificacao,
            aplicarBackground,
            verificarSessaoLocal,
            salvarSessaoLocal,
            limparSessaoLocal
        } from './scripts_telas/0_funcoes_compartilhadas.js';

        let loginModalInstance = null;

        // Verificar sessão local ao iniciar
        async function inicializarSistema() {
            // Tenta recuperar sessão do localStorage
            const sessaoLocal = verificarSessaoLocal();
            
            if (sessaoLocal) {
                // Sessão local existe - usar dados para navegação rápida
                console.log('Usando sessão local para:', sessaoLocal.login);
                
                // Atualizar interface com dados da sessão
                document.getElementById('authButtons').innerHTML = `
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user me-1"></i>${sessaoLocal.nome.split(' ')[0]}
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="logoutBtn">
                                <i class="fas fa-sign-out-alt me-2"></i>Sair
                            </a></li>
                        </ul>
                    </div>
                `;
                
                document.getElementById('logoutBtn').addEventListener('click', async () => {
                    await signOut(auth);
                    limparSessaoLocal();
                    window.location.reload();
                    mostrarNotificacao('Logout realizado com sucesso!', 'info');
                });
                
                // Carregar menu e tela inicial (sem consultar auth novamente)
                carregarMenu(sessaoLocal.cargo, sessaoLocal);
                await carregarTela('home', sessaoLocal);
                
                // Opcional: verificar auth em background (não bloqueia navegação)
                verificarAuthBackground(sessaoLocal);
                
            } else {
                // Sem sessão - mostrar tela de login
                document.getElementById('authButtons').innerHTML = '<button class="btn btn-primary" id="loginBtn">Login</button>';
                document.getElementById('loginBtn').addEventListener('click', () => {
                    loginModalInstance = new bootstrap.Modal(document.getElementById('loginModal'));
                    loginModalInstance.show();
                });
                
                document.getElementById('navMenu').innerHTML = '<li><a class="dropdown-item disabled" href="#"><i class="fas fa-lock me-2"></i>Faça login para acessar o menu</a></li>';
                
                document.getElementById('contentArea').innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-lock fa-4x text-secondary mb-4"></i>
                        <h3 class="mb-3">Sistema Protegido</h3>
                        <p class="text-muted mb-4">Por favor, faça login para acessar todas as funcionalidades</p>
                        <button class="btn btn-primary btn-lg" onclick="document.getElementById('loginBtn').click()">
                            <i class="fas fa-sign-in-alt me-2"></i>Realizar Login
                        </button>
                    </div>
                `;
                
                aplicarBackground('home', 'cliente');
            }
        }
        
        // Verificar autenticação em background (não interfere na navegação)
        async function verificarAuthBackground(sessao) {
            try {
                // Verificar se o token do Firebase ainda é válido
                if (auth.currentUser) {
                    // Token ainda válido
                    console.log('Token Firebase válido');
                } else {
                    // Token expirado - tentar renovar ou atualizar sessão
                    console.log('Token expirado, renovando...');
                    
                    // Buscar dados atualizados do Firestore
                    const userDoc = await getDoc(doc(db, 'logins', sessao.login));
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        if (userData.status_ativo) {
                            // Atualizar sessão local
                            salvarSessaoLocal({
                                login: sessao.login,
                                nome: userData.nome,
                                cargo: userData.cargo,
                                perfil: userData.perfil,
                                email: userData.email,
                                ultima_verificacao: new Date().toISOString()
                            });
                            console.log('Sessão atualizada em background');
                        } else {
                            // Usuário inativo - fazer logout
                            limparSessaoLocal();
                            mostrarNotificacao('Sessão expirada. Faça login novamente.', 'warning');
                            window.location.reload();
                        }
                    }
                }
            } catch (error) {
                console.error('Erro na verificação em background:', error);
            }
        }

        // Processar login
        document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const loginLoading = document.getElementById('loginLoading');
            const submitBtn = document.getElementById('submitLoginBtn');

            errorDiv.classList.add('d-none');
            loginLoading.classList.remove('d-none');
            submitBtn.disabled = true;

            try {
                // 1. Buscar o email do usuário no Firestore pelo login
                const userDoc = await getDoc(doc(db, 'logins', username));
                
                if (!userDoc.exists()) {
                    throw new Error('Usuário não encontrado');
                }

                const userData = userDoc.data();
                
                // 2. Verificar se está ativo
                if (!userData.status_ativo) {
                    throw new Error('Usuário inativo');
                }
                
                // 3. Verificar se tem email
                if (!userData.email) {
                    throw new Error('Email não configurado para este usuário');
                }
                
                // 4. Autenticar no Firebase Auth
                await signInWithEmailAndPassword(auth, userData.email, password);
                
                // 5. Salvar sessão LOCAL (para navegação rápida)
                salvarSessaoLocal({
                    login: username,
                    nome: userData.nome,
                    cargo: userData.cargo,
                    perfil: userData.perfil,
                    email: userData.email,
                    data_login: new Date().toISOString(),
                    ultima_verificacao: new Date().toISOString()
                });
                
                // 6. Fechar modal e mostrar sucesso
                loginModalInstance.hide();
                document.getElementById('loginForm').reset();
                mostrarNotificacao(`Bem-vindo(a) ${userData.nome}!`, 'success');
                
                // 7. Recarregar a página para usar sessão local
                window.location.reload();
                
            } catch (error) {
                console.error('Erro:', error);
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('d-none');
                loginLoading.classList.add('d-none');
                submitBtn.disabled = false;
                
                setTimeout(() => {
                    errorDiv.classList.add('d-none');
                }, 3000);
            }
        });
        
        // Monitorar mudanças no auth (apenas para logout externo)
        onAuthStateChanged(auth, async (firebaseUser) => {
            if (!firebaseUser) {
                // Usuário foi deslogado externamente
                const sessao = verificarSessaoLocal();
                if (sessao) {
                    limparSessaoLocal();
                    mostrarNotificacao('Sessão encerrada. Faça login novamente.', 'warning');
                    window.location.reload();
                }
            }
        });
        
        // Inicializar sistema
        inicializarSistema();
    </script>
</body>
</html>
