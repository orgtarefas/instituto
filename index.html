<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Instituto Evolução</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="imagens/icone.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="0_style.css">
</head>
<body>
    <!-- Header -->
    <header class="bg-white shadow-sm sticky-top">
        <nav class="container-fluid">
            <div class="row align-items-center py-2">
                <div class="col-6">
                    <img src="imagens/logo.png" alt="Logo" class="logo-img" id="logo">
                </div>
                <div class="col-6 d-flex justify-content-end align-items-center">
                    <!-- Menu de 3 pontinhos (SÓ APARECE QUANDO LOGADO) -->
                    <div class="dropdown" id="menuContainer" style="display: none;">
                        <button class="btn btn-link text-dark p-0" type="button" id="menuButton" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-ellipsis-v fa-2x"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" id="navMenu">
                            <li><a class="dropdown-item disabled" href="#">Carregando...</a></li>
                        </ul>
                    </div>
                    
                    <!-- Área de autenticação -->
                    <div id="authButtons" class="ms-3">
                        <button class="btn btn-primary" id="loginBtn">Login</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-content" id="mainContent">
        <div class="content-wrapper" id="contentArea">
            <!-- Conteúdo dinâmico -->
        </div>
    </main>

    <!-- Modal de Login -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Acesso ao Sistema</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuário</label>
                            <input type="text" class="form-control" id="username" required placeholder="Digite seu login">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="password" required placeholder="Digite sua senha">
                        </div>
                        <div id="loginError" class="alert alert-danger d-none"></div>
                        <div id="loginLoading" class="text-center d-none">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Autenticando...</span>
                            </div>
                            <p class="mt-2">Verificando credenciais...</p>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Upload de Imagem -->
    <div class="modal fade" id="uploadModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Gerenciar Imagens do Carrossel</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul class="nav nav-tabs" id="uploadTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="novo-tab" data-bs-toggle="tab" data-bs-target="#novo" type="button" role="tab">
                                <i class="fas fa-plus me-1"></i>Nova Imagem
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="listar-tab" data-bs-toggle="tab" data-bs-target="#listar" type="button" role="tab">
                                <i class="fas fa-list me-1"></i>Imagens Cadastradas
                            </button>
                        </li>
                    </ul>
                    <div class="tab-content mt-3">
                        <div class="tab-pane fade show active" id="novo" role="tabpanel">
                            <form id="uploadForm">
                                <div class="mb-3">
                                    <label class="form-label">Título</label>
                                    <input type="text" class="form-control" id="tituloImagem" required placeholder="Ex: Nova Palestra">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Descrição</label>
                                    <textarea class="form-control" id="descricaoImagem" rows="2" placeholder="Descrição da imagem"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Imagem</label>
                                    <input type="file" class="form-control" id="imagemUpload" accept="image/*" required>
                                </div>
                                <div id="uploadProgress" class="d-none">
                                    <div class="progress">
                                        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%">0%</div>
                                    </div>
                                </div>
                                <div id="uploadError" class="alert alert-danger d-none"></div>
                                <button type="submit" class="btn btn-success w-100">
                                    <i class="fas fa-upload me-2"></i>Enviar para ImgBB
                                </button>
                            </form>
                        </div>
                        <div class="tab-pane fade" id="listar" role="tabpanel">
                            <div id="listaImagens" style="max-height: 400px; overflow-y: auto;">
                                <p class="text-muted text-center">Carregando imagens...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="0_firebase_api_config.js"></script>
    <script type="module" src="scripts_telas/0_funcoes_compartilhadas.js"></script>
    <script type="module">
        import { 
            db, 
            auth, 
            signInWithEmailAndPassword, 
            signOut,
            onAuthStateChanged,
            doc, 
            getDoc,
            getDocs,
            collection,
            query,
            where,
            orderBy
        } from './0_firebase_api_config.js';
        import { 
            carregarTela, 
            carregarMenu,
            mostrarNotificacao,
            aplicarBackground,
            getCurrentUser,
            isAuthenticated,
            verificarPermissaoAdmin,
            uploadImageToImgBB,
            salvarImagemCarrossel,
            buscarImagensNovidades,
            excluirImagemCarrossel
        } from './scripts_telas/0_funcoes_compartilhadas.js';

        let loginModalInstance = null;
        let uploadModalInstance = null;
        let currentUserData = null;

        // Função para carregar Home Pública
        async function carregarHomePublica() {
            const contentArea = document.getElementById('contentArea');
            
            // Buscar imagens do banco
            const imagens = await buscarImagensNovidades();
            
            // Carrossel de Novidades
            let carrosselHtml = '';
            if (imagens.length === 0) {
                carrosselHtml = `
                    <div class="alert alert-info text-center">
                        <i class="fas fa-info-circle me-2"></i>
                        Nenhuma novidade cadastrada no momento.
                    </div>
                `;
            } else {
                carrosselHtml = `
                    <div id="carouselNovidades" class="carousel slide" data-bs-ride="carousel">
                        <div class="carousel-indicators">
                            ${imagens.map((img, idx) => `
                                <button type="button" data-bs-target="#carouselNovidades" data-bs-slide-to="${idx}" 
                                        class="${idx === 0 ? 'active' : ''}"></button>
                            `).join('')}
                        </div>
                        <div class="carousel-inner rounded-4 shadow">
                            ${imagens.map((img, idx) => `
                                <div class="carousel-item ${idx === 0 ? 'active' : ''}">
                                    <img src="${img.imagem_url}" class="d-block w-100 carousel-img" alt="${img.titulo}" style="height: 400px; object-fit: cover;">
                                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded-3 p-3">
                                        <h5>${img.titulo}</h5>
                                        <p>${img.descricao || ''}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselNovidades" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon"></span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselNovidades" data-bs-slide="next">
                            <span class="carousel-control-next-icon"></span>
                        </button>
                    </div>
                `;
            }
            
            // Serviços Fixos
            const servicos = [
                { id: 'agendamentos', titulo: 'Agendamentos', descricao: 'Agende seus horários de forma fácil e rápida', icone: 'fa-calendar-alt', cor: 'primary' },
                { id: 'palestras', titulo: 'Palestras', descricao: 'Participe das nossas palestras online', icone: 'fa-chalkboard-user', cor: 'success' },
                { id: 'cursos', titulo: 'Cursos', descricao: 'Acesse cursos exclusivos', icone: 'fa-graduation-cap', cor: 'info' },
                { id: 'junte-se', titulo: 'Junte-se ao Instituto', descricao: 'Faça parte do nosso time', icone: 'fa-users', cor: 'warning' }
            ];
            
            contentArea.innerHTML = `
                <div class="container py-4">
                    <div class="row mb-5">
                        <div class="col-12">
                            <h2 class="text-center mb-4">
                                <i class="fas fa-newspaper text-primary me-2"></i>
                                Novidades
                            </h2>
                            ${carrosselHtml}
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-12">
                            <h2 class="text-center mb-4">
                                <i class="fas fa-cogs text-primary me-2"></i>
                                Nossos Serviços
                            </h2>
                            <div class="row g-4">
                                ${servicos.map(servico => `
                                    <div class="col-md-6 col-lg-3">
                                        <div class="card h-100 text-center shadow-sm hover-card">
                                            <div class="card-body">
                                                <div class="rounded-circle bg-${servico.cor} bg-opacity-10 p-3 d-inline-block mb-3">
                                                    <i class="fas ${servico.icone} fa-3x text-${servico.cor}"></i>
                                                </div>
                                                <h5 class="card-title">${servico.titulo}</h5>
                                                <p class="card-text text-muted">${servico.descricao}</p>
                                                <small class="text-muted">Em breve mais informações</small>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            aplicarBackground('home', 'cliente');
        }
        
        // Função para carregar lista de imagens
        async function carregarListaImagens() {
            const listaDiv = document.getElementById('listaImagens');
            listaDiv.innerHTML = '<p class="text-muted text-center">Carregando...</p>';
            
            try {
                const imagens = await buscarImagensNovidades();
                
                if (imagens.length === 0) {
                    listaDiv.innerHTML = '<p class="text-muted text-center">Nenhuma imagem cadastrada</p>';
                    return;
                }
                
                listaDiv.innerHTML = '<div class="list-group">';
                imagens.forEach((img) => {
                    listaDiv.innerHTML += `
                        <div class="list-group-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="flex-grow-1">
                                    <strong>${img.titulo}</strong>
                                    <br>
                                    <small class="text-muted">${img.descricao || 'Sem descrição'}</small>
                                    <br>
                                    <small class="text-muted">Ordem: ${img.ordem || 0}</small>
                                </div>
                                <button class="btn btn-sm btn-danger ms-2" onclick="window.excluirImagemHandler('${img.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                listaDiv.innerHTML += '</div>';
                
                window.excluirImagemHandler = async (id) => {
                    if (confirm('Deseja excluir esta imagem?')) {
                        try {
                            await excluirImagemCarrossel(id);
                            mostrarNotificacao('Imagem excluída com sucesso!', 'success');
                            carregarListaImagens();
                            carregarHomePublica();
                        } catch (error) {
                            mostrarNotificacao('Erro ao excluir imagem', 'error');
                        }
                    }
                };
                
            } catch (error) {
                console.error('Erro:', error);
                listaDiv.innerHTML = '<p class="text-danger text-center">Erro ao carregar imagens</p>';
            }
        }
        
        // Verificar permissão e adicionar botão
        function adicionarBotaoGerenciar() {
            const authButtons = document.getElementById('authButtons');
            const btnExistente = document.getElementById('btnGerenciarCarrossel');
            if (!btnExistente) {
                const btnGerenciar = document.createElement('button');
                btnGerenciar.id = 'btnGerenciarCarrossel';
                btnGerenciar.className = 'btn btn-success ms-2';
                btnGerenciar.innerHTML = '<i class="fas fa-images me-1"></i>Gerenciar Carrossel';
                btnGerenciar.onclick = () => abrirModalUpload();
                authButtons.appendChild(btnGerenciar);
            }
        }
        
        function abrirModalUpload() {
            uploadModalInstance = new bootstrap.Modal(document.getElementById('uploadModal'));
            document.getElementById('uploadForm').reset();
            document.getElementById('uploadError').classList.add('d-none');
            document.getElementById('uploadProgress').classList.add('d-none');
            carregarListaImagens();
            uploadModalInstance.show();
        }
        
        function abrirModalLogin() {
            loginModalInstance = new bootstrap.Modal(document.getElementById('loginModal'));
            document.getElementById('loginForm').reset();
            document.getElementById('loginError').classList.add('d-none');
            loginModalInstance.show();
        }
        
        // Monitorar autenticação
        onAuthStateChanged(auth, async (firebaseUser) => {
            const menuContainer = document.getElementById('menuContainer');
            
            if (firebaseUser) {
                try {
                    // Buscar dados do usuário
                    const loginsRef = collection(db, 'logins');
                    const q = query(loginsRef, where('email', '==', firebaseUser.email));
                    const querySnapshot = await getDocs(q);
                    
                    if (!querySnapshot.empty) {
                        querySnapshot.forEach((doc) => {
                            currentUserData = {
                                uid: firebaseUser.uid,
                                login: doc.id,
                                ...doc.data()
                            };
                        });
                    }
                    
                    if (currentUserData && currentUserData.status_ativo) {
                        menuContainer.style.display = 'block';
                        
                        document.getElementById('authButtons').innerHTML = `
                            <div class="dropdown">
                                <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                    <i class="fas fa-user-shield me-1"></i>${currentUserData.nome.split(' ')[0]}
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" href="#" id="logoutBtn">
                                        <i class="fas fa-sign-out-alt me-2"></i>Sair
                                    </a></li>
                                </ul>
                            </div>
                        `;
                        
                        document.getElementById('logoutBtn').addEventListener('click', async () => {
                            await signOut(auth);
                            currentUserData = null;
                            menuContainer.style.display = 'none';
                            location.reload();
                        });
                        
                        carregarMenu(currentUserData.cargo, currentUserData);
                        await carregarTela('home', currentUserData);
                        
                        const podeGerenciar = await verificarPermissaoAdmin(currentUserData);
                        if (podeGerenciar) {
                            adicionarBotaoGerenciar();
                        }
                    } else {
                        await signOut(auth);
                        menuContainer.style.display = 'none';
                        carregarHomePublica();
                    }
                } catch (error) {
                    console.error('Erro:', error);
                    menuContainer.style.display = 'none';
                    carregarHomePublica();
                }
            } else {
                currentUserData = null;
                menuContainer.style.display = 'none';
                
                document.getElementById('authButtons').innerHTML = '<button class="btn btn-primary" id="loginBtn"><i class="fas fa-sign-in-alt me-2"></i>Login</button>';
                document.getElementById('loginBtn').addEventListener('click', abrirModalLogin);
                
                carregarHomePublica();
            }
        });
        
        // Processar login
        document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const loginLoading = document.getElementById('loginLoading');
            const submitBtn = document.querySelector('#loginForm button[type="submit"]');

            errorDiv.classList.add('d-none');
            loginLoading.classList.remove('d-none');
            submitBtn.disabled = true;

            try {
                const userDoc = await getDoc(doc(db, 'logins', username));
                
                if (!userDoc.exists()) {
                    throw new Error('Usuário não encontrado');
                }

                const userData = userDoc.data();
                
                if (!userData.status_ativo) {
                    throw new Error('Usuário inativo');
                }
                
                if (!userData.email) {
                    throw new Error('Email não configurado');
                }
                
                await signInWithEmailAndPassword(auth, userData.email, password);
                
                loginModalInstance.hide();
                mostrarNotificacao(`Bem-vindo(a) ${userData.nome}!`, 'success');
                
            } catch (error) {
                let mensagem = error.message;
                if (error.code === 'auth/invalid-credential') {
                    mensagem = 'Usuário ou senha incorretos';
                }
                errorDiv.textContent = mensagem;
                errorDiv.classList.remove('d-none');
                loginLoading.classList.add('d-none');
                submitBtn.disabled = false;
            }
        });
        
        // Processar upload
        document.getElementById('uploadForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const titulo = document.getElementById('tituloImagem').value;
            const descricao = document.getElementById('descricaoImagem').value;
            const file = document.getElementById('imagemUpload').files[0];
            const errorDiv = document.getElementById('uploadError');
            const submitBtn = document.querySelector('#uploadForm button[type="submit"]');
            const progressDiv = document.getElementById('uploadProgress');
            const progressBar = progressDiv.querySelector('.progress-bar');
            
            if (!file) {
                errorDiv.textContent = 'Selecione uma imagem';
                errorDiv.classList.remove('d-none');
                return;
            }
            
            errorDiv.classList.add('d-none');
            progressDiv.classList.remove('d-none');
            submitBtn.disabled = true;
            progressBar.style.width = '0%';
            
            try {
                const imageUrl = await uploadImageToImgBB(file, (percent) => {
                    progressBar.style.width = `${percent}%`;
                    progressBar.textContent = `${percent}%`;
                });
                
                await salvarImagemCarrossel({
                    titulo: titulo,
                    descricao: descricao,
                    imagem_url: imageUrl,
                    tipo: 'novidades',
                    criado_por: currentUserData?.login || 'admin'
                });
                
                mostrarNotificacao('Imagem cadastrada com sucesso!', 'success');
                uploadModalInstance.hide();
                document.getElementById('uploadForm').reset();
                carregarHomePublica();
                
            } catch (error) {
                console.error('Erro:', error);
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('d-none');
            } finally {
                progressDiv.classList.add('d-none');
                submitBtn.disabled = false;
                progressBar.style.width = '0%';
            }
        });
    </script>
</body>
</html>
